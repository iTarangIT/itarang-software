name: Deploy Production to VPS

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          port: ${{ secrets.PROD_VPS_PORT }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eo pipefail
            APP_DIR=/home/itarang-crm/htdocs/crm.itarang.com
            cd "$APP_DIR"

            echo "=== Pulling latest from production branch ==="
            git fetch origin production
            git reset --hard origin/production

            echo "=== Writing .env.production from secret ==="
            umask 077
            echo "${{ secrets.PROD_ENV_FILE_B64 }}" | base64 -d > .env.production
            chmod 600 .env.production

            echo "=== Installing dependencies (conditional on package-lock) ==="
            # npm ci wipes and reinstalls node_modules from scratch every deploy —
            # ~19 min of RAM/IO thrash on this shared 8 GB box (run 26678229305)
            # and a major disk-churn source. Skip it when package-lock.json is
            # unchanged and node_modules is already present. The hash lives
            # OUTSIDE the repo so the `git reset --hard` above can't wipe it.
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            HASH_FILE="$HOME/.itarang-prod-lock-hash"
            LAST_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "")
            if [ "$LOCK_HASH" = "$LAST_HASH" ] && [ -d node_modules ]; then
              echo "package-lock.json unchanged ($LOCK_HASH) — skipping npm ci"
            else
              echo "Lock changed (was ${LAST_HASH:-none}, now $LOCK_HASH) — running npm ci"
              npm ci --no-audit --no-fund --include=dev
              echo "$LOCK_HASH" > "$HASH_FILE"
            fi

            echo "=== Preparing logs directory ==="
            mkdir -p logs

            echo "=== Provision headless Chromium (libs + browser) + preflight ==="
            # Installs google-chrome-stable (the binary PUPPETEER_EXECUTABLE_PATH
            # points at) plus the GTK/NSS libs Chromium links against, then runs a
            # launch preflight. Without this, PDF rendering (Initiate Agreement,
            # KYC consent, audit trail) throws "Failed to launch the browser
            # process ... ENOENT" because nothing in the pipeline ever installed
            # the browser. Idempotent: skips apt when already present. Runs under
            # the block's `set -eo pipefail` + script_stop, so a failed preflight
            # aborts the deploy here — before pm2 is restarted onto the new build.
            chmod +x scripts/sandbox-system-setup.sh
            ./scripts/sandbox-system-setup.sh

            ARCHIVE_DIR=/home/itarang-crm/static_archive
            ARCHIVE_KEEP=10

            echo "=== Snapshot previous .next/static into archive ring ==="
            mkdir -p "$ARCHIVE_DIR" 2>/dev/null || true
            # This shared 8 GB box runs tight: run 26678229305 died HERE when
            # `cp -a .next/static` hit ENOSPC after a 19-min npm ci. The archive
            # ring is only a stale-tab optimization (serves old chunks during the
            # swap window) — it must NEVER abort the deploy, and duplicating
            # static/ is the wrong move when disk is low. So: reclaim old
            # snapshots first, show disk, then snapshot only if there's headroom,
            # and never let a failure here stop the build (rm -rf .next below
            # frees the old build's space regardless of what we do here).
            ls -1td "$ARCHIVE_DIR"/*/ 2>/dev/null | tail -n +$((ARCHIVE_KEEP + 1)) | xargs -r rm -rf || true
            df -h "$APP_DIR" | tail -1 || true
            AVAIL_KB=$(df -P "$APP_DIR" 2>/dev/null | awk 'NR==2 {print $4}' || echo 0)
            OLD_BUILD_ID=""
            if [ -f .next/BUILD_ID ]; then OLD_BUILD_ID=$(cat .next/BUILD_ID); fi
            if [ "${AVAIL_KB:-0}" -lt 1572864 ]; then
              echo "::warning::only $(( ${AVAIL_KB:-0} / 1024 )) MB free in $APP_DIR — skipping archive snapshot to protect the build"
            elif [ -n "$OLD_BUILD_ID" ] && [ -d .next/static ]; then
              rm -rf "$ARCHIVE_DIR/$OLD_BUILD_ID"
              if cp -a .next/static "$ARCHIVE_DIR/$OLD_BUILD_ID"; then
                echo "Archived $OLD_BUILD_ID ($(find "$ARCHIVE_DIR/$OLD_BUILD_ID" -type f | wc -l) files)"
              else
                echo "::warning::archive snapshot failed (disk?) — continuing without it"
                rm -rf "$ARCHIVE_DIR/$OLD_BUILD_ID" 2>/dev/null || true
              fi
            else
              echo "No previous BUILD_ID/.next/static — first build or clean checkout"
            fi

            echo "=== Cleaning prior build state ==="
            # Forces deterministic builds. The archive ring above already
            # snapshot the prior .next/static into $ARCHIVE_DIR/$OLD_BUILD_ID,
            # so the stale-tab grace period is preserved. Without this nuke,
            # .next/standalone/.next/server + .next/cache/turbopack can carry
            # references the new build doesn't re-emit, surfacing as
            # NOT-ON-DISK chunks at the served-asset verification step.
            rm -rf .next

            echo "=== Building Next.js (standalone) ==="
            export GITHUB_SHA=$(git rev-parse HEAD)
            echo "Building with GITHUB_SHA=$GITHUB_SHA"
            # next build (webpack) for an app this size peaks past Node's
            # default ~2 GB old-space heap — the build worker SIGABRTs with
            # "Reached heap limit / heap out of memory" without this. 4 GB
            # fits the 8 GB VPS alongside the running app.
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build

            echo "=== Merge archived chunks into new build (stale-tab grace period) ==="
            NEW_BUILD_ID=""
            if [ -f .next/BUILD_ID ]; then NEW_BUILD_ID=$(cat .next/BUILD_ID); fi
            if [ -d "$ARCHIVE_DIR" ]; then
              for archived in "$ARCHIVE_DIR"/*/; do
                [ -d "$archived" ] || continue
                archived_id=$(basename "$archived")
                if [ "$archived_id" = "$NEW_BUILD_ID" ]; then continue; fi
                # chunks/css/media only — never manifests, BUILD_ID, or server/.
                # --ignore-existing guarantees new build artifacts always win.
                for sub in chunks css media; do
                  if [ -d "$archived/$sub" ]; then
                    mkdir -p ".next/static/$sub"
                    rsync -a --ignore-existing "$archived/$sub/" ".next/static/$sub/"
                  fi
                done
              done
              echo "After merge: $(find .next/static -type f | wc -l) files in .next/static"
            fi

            echo "=== Prune archive ring (keep $ARCHIVE_KEEP newest) ==="
            if [ -d "$ARCHIVE_DIR" ]; then
              ls -1td "$ARCHIVE_DIR"/*/ 2>/dev/null | tail -n +$((ARCHIVE_KEEP + 1)) | xargs -r rm -rf
              echo "Archive now holds $(ls -1d "$ARCHIVE_DIR"/*/ 2>/dev/null | wc -l) builds"
            fi

            echo "=== Verify every chunk referenced by the build manifest exists on disk ==="
            # Catches the failure mode where a build emits a manifest that
            # points at chunk files the build (or a subsequent step) didn't
            # actually write to disk — which silently succeeds the deploy
            # but 404s every page.
            #
            # Intentionally run via a committed script, not node -e: drone-ssh
            # appends shell boilerplate for exit-code propagation, and with
            # a multi-line `node -e '...'` argument that boilerplate gets
            # injected into the -e string and Node tries to parse it as JS.
            node scripts/verify-chunk-manifest.js

            echo "=== Assembling standalone bundle ==="
            cp .env.production .next/standalone/.env.production
            cp .env.production .next/standalone/.env
            rm -rf .next/standalone/.next/static
            cp -r .next/static .next/standalone/.next/static
            rm -rf .next/standalone/public
            if [ -d public ]; then cp -r public .next/standalone/public; fi

            echo "=== Copy @sparticuz/chromium (incl bin/) into standalone ==="
            # Next.js standalone file-tracing resolves @sparticuz/chromium's
            # binary by runtime path, not require(), so it drops the bin/ dir —
            # which makes the @sparticuz launch path fail with "input directory
            # .../@sparticuz/chromium/bin does not exist". Copy the full package
            # (npm ci --include=dev above guarantees it's on disk) so the
            # bundled-Chromium fallback in launch-browser.ts actually works.
            if [ -d node_modules/@sparticuz/chromium ]; then
              mkdir -p .next/standalone/node_modules/@sparticuz
              rm -rf .next/standalone/node_modules/@sparticuz/chromium
              cp -r node_modules/@sparticuz/chromium .next/standalone/node_modules/@sparticuz/chromium
            fi
            # puppeteer-core is normally traced, but copy defensively if missing.
            if [ ! -d .next/standalone/node_modules/puppeteer-core ] && [ -d node_modules/puppeteer-core ]; then
              cp -r node_modules/puppeteer-core .next/standalone/node_modules/puppeteer-core
            fi

            echo "=== Ensure Google Chrome is installed (PDF/agreement rendering) ==="
            # Primary Chromium path for launch-browser.ts on the VPS
            # (PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable). Idempotent:
            # fast-paths out when Chrome is already present.
            bash scripts/prod-system-setup.sh

            echo "=== Stop pm2 + guarantee port 3002 is free ==="
            # Previous "poll for port free" logic was unreliable — the ss
            # filter syntax could silently return empty, the loop would
            # declare the port free while the old process was still holding
            # it, pm2 start would EADDRINUSE, crash-loop, give up, and the
            # OLD process kept serving stale HTML against the new .next.
            # Do it deterministically: delete the pm2 entries, then
            # unconditionally fuser -k the port, then sleep. Whatever was
            # listening is guaranteed dead before pm2 start runs.
            for app in itarang-crm-new itarang-crm-web; do
              if pm2 describe "$app" > /dev/null 2>&1; then
                pm2 delete "$app" 2>/dev/null || true
              fi
            done
            fuser -k 3002/tcp 2>/dev/null || true
            sleep 3
            echo "Port 3002 cleared"

            echo "=== Start pm2 fresh ==="
            pm2 start ecosystem.prod.config.js
            pm2 save
            pm2 ls

            echo "=== Health check ==="
            HTTP=000
            for i in $(seq 1 30); do
              sleep 2
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/ || echo 000)
              if echo "$HTTP" | grep -qE "^(200|301|302|307)$"; then
                echo "HTTP $HTTP after ${i} polls"
                break
              fi
            done
            if ! echo "$HTTP" | grep -qE "^(200|301|302|307)$"; then
              echo "❌ Production failed health check (HTTP $HTTP)"
              pm2 logs itarang-crm-web --lines 50 --nostream || true
              exit 1
            fi
            echo "✅ Production healthy"

            echo "=== Verify served BUILD_ID matches disk ==="
            # Detects a stale-process deploy: disk has a new BUILD_ID but the
            # running process still serves HTML tagged with the previous
            # build's id, so chunk references don't exist on disk. Fail loudly
            # rather than letting the deploy lie about success.
            DISK_BUILD_ID=$(cat .next/BUILD_ID 2>/dev/null || echo "missing")
            # Hit /login directly — / may 307 with no body so grep finds
            # nothing. -L follows redirects either way. Wrap the pipeline in
            # `|| true` so a no-match grep doesn't abort the script under
            # set -eo pipefail.
            HTML=$(curl -s -L http://127.0.0.1:3002/login 2>/dev/null || true)
            SERVED_BUILD_ID=$(printf '%s' "$HTML" | grep -oE '"b":"[a-f0-9]+"' | head -1 | cut -d'"' -f4 || true)
            echo "Disk BUILD_ID:   $DISK_BUILD_ID"
            echo "Served BUILD_ID: ${SERVED_BUILD_ID:-<not found>}"
            if [ -n "$SERVED_BUILD_ID" ] && [ "$DISK_BUILD_ID" != "$SERVED_BUILD_ID" ]; then
              echo "❌ BUILD_ID mismatch — running process is stale"
              exit 1
            fi

            echo "=== Verify served assets reachable (HEAD on every chunk in served HTML) ==="
            # Catches the failure mode that verify-chunk-manifest.js can miss:
            # the static walker only sees chunks referenced from .next/ files
            # on disk; this step hits the running app and HEAD-checks every
            # asset referenced by actual served HTML, so 404s become deploy
            # failures instead of runtime ChunkLoadError on real users.
            PORT=3002 node scripts/verify-served-assets.js
