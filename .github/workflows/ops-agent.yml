name: ops-agent (manual)

# Install or dry-run the Ops Console host agent on sandbox or production.
#
# WHY THIS EXISTS. The agent install is a manual per-box step, and the boxes are
# reachable by exactly one credential: the deploy key in SANDBOX_VPS_SSH_KEY /
# PROD_VPS_SSH_KEY. Those are GitHub secrets, which are write-only — the
# runbook's own key procedure ends with `rm ~/.ssh/itarang_deploy`, so the
# private key exists nowhere else. A workstation without that key cannot reach
# the boxes at all, which is where this stalled. Actions can, so the install
# runs here.
#
# MANUAL DISPATCH ONLY. No push, schedule or PR trigger — this touches
# production, and it should happen when somebody decides it should.
#
# Defaults are sandbox + dry-run: the least destructive combination, so a
# mis-click validates something instead of starting something.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which box"
        type: choice
        options: [sandbox, production]
        default: sandbox
        required: true
      mode:
        description: "dry-run validates and starts nothing; install daemonises under pm2"
        type: choice
        options: [dry-run, install]
        default: dry-run
        required: true

# One at a time per environment. Two concurrent runs would race on pm2.
concurrency:
  group: ops-agent-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── sandbox ────────────────────────────────────────────────────────────
  sandbox:
    if: inputs.environment == 'sandbox'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/itarang-sandbox/htdocs/sandbox.itarang.com
      AGENT_DIR: /home/itarang-sandbox/ops-agent
    steps:
      - uses: actions/checkout@v4

      - name: Copy ops-agent to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SANDBOX_VPS_HOST }}
          username: ${{ secrets.SANDBOX_VPS_USER }}
          port: ${{ secrets.SANDBOX_VPS_PORT }}
          key: ${{ secrets.SANDBOX_VPS_SSH_KEY }}
          source: "ops-agent/*"
          target: "${{ env.AGENT_DIR }}/"
          strip_components: 1
          overwrite: true
          timeout: 2m

      - name: Run install.sh (${{ inputs.mode }})
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_VPS_HOST }}
          username: ${{ secrets.SANDBOX_VPS_USER }}
          port: ${{ secrets.SANDBOX_VPS_PORT }}
          key: ${{ secrets.SANDBOX_VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          # Fail the job when the script does. The whole point of install.sh is
          # that it refuses a broken install; swallowing that would undo it.
          script_stop: true
          envs: APP_DIR,AGENT_DIR,MODE,IN_URL,IN_SECRET,IN_HOST,IN_CERT
          script: |
            set -eo pipefail
            cd "$AGENT_DIR"
            chmod +x install.sh
            # Explicit rather than auto-detected: the agent lives in ~ and the
            # CRM's logs live under APP_DIR, so ../shared/logs would not find
            # them. install.sh treats an exported value as authoritative, so a
            # stale OPS_LOG_DIR in shared/.env cannot override this.
            export OPS_ENV_FILE="$APP_DIR/shared/.env"
            export OPS_LOG_DIR="$APP_DIR/shared/logs"
            # The agent-side trio. Supplied from GitHub secrets when they exist,
            # otherwise left unset so install.sh falls back to shared/.env.
            #
            # WITHOUT THIS BLOCK a first install cannot succeed: the workflow
            # passed only OPS_ENV_FILE and OPS_LOG_DIR, so install.sh died with
            # "missing required config: OPS_INGEST_URL OPS_INGEST_SECRET
            # OPS_HOST_NAME" unless somebody had already hand-edited the box —
            # and those three variables are documented only in the agent's own
            # README, in no env-file checklist anywhere.
            # if-blocks, not `[ -n "$X" ] && export …`: under `set -e` a false
            # test as the first half of an && list is survivable but leaves the
            # list returning 1, and as the last statement of a script that is an
            # exit code. Explicit is cheaper than remembering that rule.
            if [ -n "$IN_URL" ];    then export OPS_INGEST_URL="$IN_URL"; fi
            if [ -n "$IN_SECRET" ]; then export OPS_INGEST_SECRET="$IN_SECRET"; fi
            if [ -n "$IN_HOST" ];   then export OPS_HOST_NAME="$IN_HOST"; fi
            if [ -n "$IN_CERT" ];   then export OPS_CERT_DOMAIN="$IN_CERT"; fi
            if [ "$MODE" = "install" ]; then
              ./install.sh
            else
              ./install.sh --dry-run
            fi
        env:
          MODE: ${{ inputs.mode }}
          # SANDBOX values only. The two jobs never share a secret name, so a
          # sandbox run cannot reach production's ingest and vice versa.
          # Undefined secrets arrive as empty strings, which the script treats
          # as "not supplied" and falls back to the box's shared/.env.
          IN_URL: ${{ secrets.SANDBOX_OPS_INGEST_URL }}
          IN_SECRET: ${{ secrets.SANDBOX_OPS_INGEST_SECRET }}
          IN_HOST: ${{ secrets.SANDBOX_OPS_HOST_NAME }}
          IN_CERT: ${{ secrets.SANDBOX_OPS_CERT_DOMAIN }}

  # ── production ─────────────────────────────────────────────────────────
  production:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    # A second, deliberate gate. Configure a required reviewer on this
    # environment in repo settings and a production run needs an approval.
    environment: production
    env:
      APP_DIR: /home/itarang-crm/htdocs/crm.itarang.com
      AGENT_DIR: /home/itarang-crm/ops-agent
    steps:
      - uses: actions/checkout@v4

      - name: Copy ops-agent to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          port: ${{ secrets.PROD_VPS_PORT }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          source: "ops-agent/*"
          target: "${{ env.AGENT_DIR }}/"
          strip_components: 1
          overwrite: true
          timeout: 2m

      - name: Run install.sh (${{ inputs.mode }})
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          port: ${{ secrets.PROD_VPS_PORT }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          envs: APP_DIR,AGENT_DIR,MODE,IN_URL,IN_SECRET,IN_HOST,IN_CERT
          script: |
            set -eo pipefail
            cd "$AGENT_DIR"
            chmod +x install.sh
            # install.sh treats an exported value as authoritative, so a stale
            # OPS_LOG_DIR in shared/.env cannot override this.
            export OPS_ENV_FILE="$APP_DIR/shared/.env"
            export OPS_LOG_DIR="$APP_DIR/shared/logs"
            # The agent-side trio, from GitHub secrets when set. See the sandbox
            # job for why this block is load-bearing. NOTE FOR PRODUCTION: prod's
            # shared/.env is rewritten from PROD_ENV_FILE_B64 on EVERY deploy
            # (deploy-production.yml), so a value hand-added to the box is erased
            # by the next release and ingest silently reverts to 503. Supplying
            # the trio here, from secrets, is the durable route.
            if [ -n "$IN_URL" ];    then export OPS_INGEST_URL="$IN_URL"; fi
            if [ -n "$IN_SECRET" ]; then export OPS_INGEST_SECRET="$IN_SECRET"; fi
            if [ -n "$IN_HOST" ];   then export OPS_HOST_NAME="$IN_HOST"; fi
            if [ -n "$IN_CERT" ];   then export OPS_CERT_DOMAIN="$IN_CERT"; fi
            if [ "$MODE" = "install" ]; then
              ./install.sh
            else
              ./install.sh --dry-run
            fi
        env:
          MODE: ${{ inputs.mode }}
          # PRODUCTION values only — a separate set of secret names from the
          # sandbox job above, so neither environment can be configured with the
          # other's ingest URL or secret by a typo in one place.
          IN_URL: ${{ secrets.PROD_OPS_INGEST_URL }}
          IN_SECRET: ${{ secrets.PROD_OPS_INGEST_SECRET }}
          IN_HOST: ${{ secrets.PROD_OPS_HOST_NAME }}
          IN_CERT: ${{ secrets.PROD_OPS_CERT_DOMAIN }}
