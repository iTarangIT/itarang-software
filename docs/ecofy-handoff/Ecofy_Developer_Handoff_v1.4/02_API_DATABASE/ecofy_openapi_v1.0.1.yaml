openapi: 3.1.0
info:
  title: Ecofy Lead Workspace API
  version: 1.0.1
  description: Contract for ecofy.itarang.com (see README for the current BRD). All paths are under /api/v1. x-roles lists the only roles allowed;
    case visibility rules apply to every call. Amount fields a role may not see are omitted, never null.
servers:
- url: https://ecofy.itarang.com/api/v1
- url: https://ecofy-sandbox.itarang.com/api/v1
security:
- session: []
paths:
  /auth/session:
    post:
      tags:
      - M01 Access
      summary: Register the Supabase session; checks the device
      x-roles: &id001
      - ECOFY_ADMIN
      - ECOFY_USER
      - ITARANG_ADMIN
      - ITARANG_CALLER
      operationId: post_auth_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRegister'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionState'
                additionalProperties: false
                required:
                - data
        default: &id002
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/device/verify:
    post:
      tags:
      - M01 Access
      summary: Verify the emailed device OTP; trusts the device
      x-roles: *id001
      operationId: post_auth_device_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceVerify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionState'
                additionalProperties: false
                required:
                - data
        default: *id002
  /auth/device/resend:
    post:
      tags:
      - M01 Access
      summary: Resend the device OTP
      x-roles: *id001
      operationId: post_auth_device_resend
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionState'
                additionalProperties: false
                required:
                - data
        default: *id002
  /auth/logout:
    post:
      tags:
      - M01 Access
      summary: End the session
      x-roles: *id001
      operationId: post_auth_logout
      responses:
        '200':
          description: OK
        default: *id002
  /me:
    get:
      tags:
      - M01 Access
      summary: Current user and permissions
      x-roles: *id001
      operationId: get_me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                additionalProperties: false
                required:
                - data
        default: *id002
  /users:
    get:
      tags:
      - M01 Access
      summary: 'List users (EA: Ecofy only)'
      x-roles: &id003
      - ECOFY_ADMIN
      - ITARANG_ADMIN
      operationId: get_users
      parameters:
      - &id007
        name: cursor
        in: query
        schema: &id006
          type: string
      - &id008
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Page'
                additionalProperties: false
                required:
                - data
                - meta
        default: *id002
    post:
      tags:
      - M01 Access
      summary: Invite a user (seat check)
      x-roles: *id003
      operationId: post_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvite'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                additionalProperties: false
                required:
                - data
        default: *id002
  /users/{userId}:
    patch:
      tags:
      - M01 Access
      summary: Rename, deactivate, reactivate
      x-roles: *id003
      operationId: patch_users_userId
      parameters:
      - name: userId
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                additionalProperties: false
                required:
                - data
        default: *id002
  /users/{userId}/reset-password:
    post:
      tags:
      - M01 Access
      summary: Send a reset link
      x-roles: *id003
      operationId: post_users_userId_reset_password
      parameters:
      - name: userId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
        default: *id002
  /users/{userId}/revoke-devices:
    post:
      tags:
      - M01 Access
      summary: Revoke all trusted devices of a user
      x-roles: &id005
      - ITARANG_ADMIN
      operationId: post_users_userId_revoke_devices
      parameters:
      - name: userId
        in: path
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: OK
        default: *id002
  /seats:
    get:
      tags:
      - M01 Access
      summary: Seat limits and usage
      x-roles: *id005
      operationId: get_seats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          $ref: '#/components/schemas/Role'
                        seatLimit:
                          type: integer
                        seatsUsed:
                          type: integer
                      additionalProperties: false
                additionalProperties: false
                required:
                - data
        default: *id002
  /seats/{role}:
    patch:
      tags:
      - M01 Access
      summary: Change a seat cap
      x-roles: *id005
      operationId: patch_seats_role
      parameters:
      - name: role
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatLimitPatch'
      responses:
        '200':
          description: OK
        default: *id002
  /settings:
    get:
      tags:
      - M02 Settings
      summary: All settings
      x-roles: *id003
      operationId: get_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                additionalProperties: false
                required:
                - data
        default: *id002
  /settings/{key}:
    patch:
      tags:
      - M02 Settings
      summary: Change a setting (logged)
      x-roles: *id005
      operationId: patch_settings_key
      parameters:
      - name: key
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingPatch'
      responses:
        '200':
          description: OK
        default: *id002
  /lists/{listCode}/items:
    get:
      tags:
      - M02 Settings
      summary: List items
      x-roles: *id001
      operationId: get_lists_listCode_items
      parameters:
      - name: listCode
        in: path
        required: true
        schema: *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                additionalProperties: false
                required:
                - data
        default: *id002
    post:
      tags:
      - M02 Settings
      summary: Add a list item
      x-roles: *id005
      operationId: post_lists_listCode_items
      parameters:
      - name: listCode
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListItemCreate'
      responses:
        '201':
          description: OK
        default: *id002
  /lists/{listCode}/items/{itemId}:
    patch:
      tags:
      - M02 Settings
      summary: Rename, reorder, deactivate
      x-roles: *id005
      operationId: patch_lists_listCode_items_itemId
      parameters:
      - name: listCode
        in: path
        required: true
        schema: *id006
      - name: itemId
        in: path
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListItemPatch'
      responses:
        '200':
          description: OK
        default: *id002
  /calendar:
    get:
      tags:
      - M02 Settings
      summary: Working hours and holidays
      x-roles: *id003
      operationId: get_calendar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CalendarPut'
                additionalProperties: false
                required:
                - data
        default: *id002
    put:
      tags:
      - M02 Settings
      summary: Replace working hours and holidays
      x-roles: *id005
      operationId: put_calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarPut'
      responses:
        '200':
          description: OK
        default: *id002
  /epc-partners:
    get:
      tags:
      - M02 Settings
      summary: EPC partners
      x-roles: *id001
      operationId: get_epc_partners
      parameters:
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EpcPartner'
                  meta:
                    $ref: '#/components/schemas/Page'
                additionalProperties: false
                required:
                - data
                - meta
        default: *id002
    post:
      tags:
      - M02 Settings
      summary: Add an EPC partner
      x-roles: *id005
      operationId: post_epc_partners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpcPartner'
      responses:
        '201':
          description: OK
        default: *id002
  /epc-partners/{partnerId}:
    patch:
      tags:
      - M02 Settings
      summary: Edit an EPC partner
      x-roles: *id005
      operationId: patch_epc_partners_partnerId
      parameters:
      - name: partnerId
        in: path
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpcPartner'
      responses:
        '200':
          description: OK
        default: *id002
  /financiers:
    get:
      tags:
      - M02 Settings
      summary: Financiers
      x-roles: *id003
      operationId: get_financiers
      parameters:
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Financier'
                  meta:
                    $ref: '#/components/schemas/Page'
                additionalProperties: false
                required:
                - data
                - meta
        default: *id002
    post:
      tags:
      - M02 Settings
      summary: Add a financier
      x-roles: *id005
      operationId: post_financiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Financier'
      responses:
        '201':
          description: OK
        default: *id002
  /financiers/{financierId}:
    patch:
      tags:
      - M02 Settings
      summary: Edit a financier
      x-roles: *id005
      operationId: patch_financiers_financierId
      parameters:
      - name: financierId
        in: path
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Financier'
      responses:
        '200':
          description: OK
        default: *id002
  /imports/template:
    get:
      tags:
      - M03 Intake
      summary: Download lead upload template v0.3
      x-roles: *id003
      operationId: get_imports_template
      responses:
        '200':
          description: OK
        default: *id002
  /imports:
    post:
      tags:
      - M03 Intake
      summary: Start an import (presigned upload URL)
      x-roles: *id003
      operationId: post_imports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStart'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UploadTicket'
                additionalProperties: false
                required:
                - data
        default: *id002
  /imports/{importId}/mapping:
    post:
      tags:
      - M03 Intake
      summary: Save the column mapping
      x-roles: *id003
      operationId: post_imports_importId_mapping
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMapping'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Import'
                additionalProperties: false
                required:
                - data
        default: *id002
  /imports/{importId}/validate:
    post:
      tags:
      - M03 Intake
      summary: Dry run with counts and row errors
      x-roles: *id003
      operationId: post_imports_importId_validate
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportPreview'
                additionalProperties: false
                required:
                - data
        default: *id002
  /imports/{importId}/commit:
    post:
      tags:
      - M03 Intake
      summary: Commit with consent confirmation
      x-roles: *id003
      operationId: post_imports_importId_commit
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id004
      - &id009
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommit'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Import'
                additionalProperties: false
                required:
                - data
        default: *id002
  /imports/{importId}:
    get:
      tags:
      - M03 Intake
      summary: Import status
      x-roles: *id003
      operationId: get_imports_importId
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Import'
                additionalProperties: false
                required:
                - data
        default: *id002
  /imports/{importId}/report.csv:
    get:
      tags:
      - M03 Intake
      summary: Row-level report (CSV)
      x-roles: *id003
      operationId: get_imports_importId_report_csv
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
        default: *id002
  /cases:
    post:
      tags:
      - M03 Intake
      summary: Create a single lead
      x-roles:
      - ECOFY_USER
      - ECOFY_ADMIN
      - ITARANG_ADMIN
      operationId: post_cases
      parameters:
      - *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
    get:
      tags:
      - M04 Qualification
      summary: List cases (scoped)
      x-roles: *id001
      operationId: get_cases
      parameters:
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Case'
                  meta:
                    $ref: '#/components/schemas/Page'
                additionalProperties: false
                required:
                - data
                - meta
        default: *id002
  /cases/{caseId}:
    get:
      tags:
      - M04 Qualification
      summary: Case detail (scoped)
      x-roles: *id001
      operationId: get_cases_caseId
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/{caseId}/timeline:
    get:
      tags:
      - M18 Audit
      summary: Stage history, activities, documents, decisions
      x-roles: *id001
      operationId: get_cases_caseId_timeline
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/{caseId}/assign:
    post:
      tags:
      - M04 Qualification
      summary: Assign or reassign
      x-roles: *id003
      operationId: post_cases_caseId_assign
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      - &id010
        name: If-Match
        in: header
        required: true
        schema:
          type: integer
        description: Current case version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/bulk-assign:
    post:
      tags:
      - M04 Qualification
      summary: Bulk assign (S0 by EA, S1+ by IA)
      x-roles: *id003
      operationId: post_cases_bulk_assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssign'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            caseId: *id004
                            code: *id006
                          additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/{caseId}/temperature:
    post:
      tags:
      - M04 Qualification
      summary: Set temperature; Hot moves to S1
      x-roles:
      - ECOFY_USER
      - ECOFY_ADMIN
      operationId: post_cases_caseId_temperature
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/{caseId}/push:
    post:
      tags:
      - M04 Qualification
      summary: Push a Warm lead to S1
      x-roles:
      - ECOFY_USER
      - ECOFY_ADMIN
      operationId: post_cases_caseId_push
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
  /cases/{caseId}/close:
    post:
      tags:
      - M14 Withdrawal
      summary: Close before acceptance (stage owner)
      x-roles: *id001
      operationId: post_cases_caseId_close
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id004
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Close'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Case'
                additionalProperties: false
                required:
                - data
        default: *id002
  /queue:
    get:
      tags:
      - M05 Queue
      summary: Hot first, then Warm, with ageing
      x-roles: *id005
      operationId: get_queue
      parameters:
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Case'
                  meta:
                    $ref: '#/components/schemas/Page'
                additionalProperties: false
                required:
                - data
                - meta
        default: *id002
  /cases/{caseId}/return:
    post:
      tags:
      - M05 Queue
