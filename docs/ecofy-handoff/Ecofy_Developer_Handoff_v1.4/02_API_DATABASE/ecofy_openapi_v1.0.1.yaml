components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - VALIDATION_FAILED
              - UNAUTHENTICATED
              - SESSION_REPLACED
              - DEVICE_VERIFICATION_REQUIRED
              - FORBIDDEN
              - NOT_FOUND
              - VERSION_CONFLICT
              - GATE_NOT_MET
              - SEAT_LIMIT
              - IDEMPOTENCY_KEY_REUSED
              - RATE_LIMITED
            message: *id006
            details:
              type: object
            gate:
              type: string
              description: Name of the failed gate when code = GATE_NOT_MET
            requestId: *id006
          additionalProperties: false
          required:
          - code
          - message
          - requestId
      additionalProperties: false
      required:
      - error
    Page:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
      additionalProperties: false
      required:
      - nextCursor
    Role:
      type: string
      enum:
      - ECOFY_ADMIN
      - ECOFY_USER
      - ITARANG_ADMIN
      - ITARANG_CALLER
    Stage:
      type: string
      enum:
      - S0
      - S1
      - S2
      - S3
      - S4
      - S5
      - S6
      - S7
      - S8
      - CLOSED
    Segment:
      type: string
      enum:
      - RESI
      - ESS
      - CI
    Temperature:
      type: string
      enum:
      - COLD
      - WARM
      - HOT
      - NOT_INTERESTED
    Reason:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
      required:
      - reason
    Note:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
      additionalProperties: false
    SessionRegister:
      type: object
      properties: {}
      additionalProperties: false
      description: Called right after Supabase signInWithPassword. The device cookie is read from the request.
    SessionState:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - DEVICE_OTP_SENT
        otpExpiresAt: *id014
        resendAfterSeconds:
          type: integer
      additionalProperties: false
      required:
      - status
    DeviceVerify:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
      required:
      - code
    Me:
      type: object
      properties:
        id: *id004
        fullName: *id006
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        org:
          type: string
          enum:
          - ECOFY
          - ITARANG
        permissions:
          type: array
          items: *id006
      additionalProperties: false
      required:
      - id
      - fullName
      - email
      - role
      - org
      - permissions
    UserInvite:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^[6-9][0-9]{9}$
        role:
          $ref: '#/components/schemas/Role'
      additionalProperties: false
      required:
      - fullName
      - email
      - role
    UserPatch:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        status:
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
        reason:
          type: string
          maxLength: 500
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id004
        fullName: *id006
        email: *id006
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - DEACTIVATED
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - id
      - fullName
      - email
      - role
      - status
    SeatLimitPatch:
      type: object
      properties:
        seatLimit:
          type: integer
          minimum: 0
          maximum: 50
        reason:
          type: string
          minLength: 3
      additionalProperties: false
      required:
      - seatLimit
      - reason
    SettingPatch:
      type: object
      properties:
        value: {}
        reason:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
      - value
      description: value must match the setting's type (see seed)
    ListItemCreate:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{2,40}$
        label:
          type: string
          minLength: 1
          maxLength: 80
        sortOrder:
          type: integer
      additionalProperties: false
      required:
      - code
      - label
    ListItemPatch:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        sortOrder:
          type: integer
        active: *id013
      additionalProperties: false
    CalendarPut:
      type: object
      properties:
        workingHours:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
              start:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
              end:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
            additionalProperties: false
            required:
            - weekday
            - start
            - end
        holidays:
          type: array
          items:
            type: object
            properties:
              day: &id015
                type: string
                format: date
              name: *id006
            additionalProperties: false
            required:
            - day
            - name
      additionalProperties: false
      required:
      - workingHours
      - holidays
    EpcPartner:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        contactName: *id006
        mobile:
          type: string
          pattern: ^[6-9][0-9]{9}$
        email:
          type: string
          format: email
        pincodes:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]{5}$
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        active: *id013
      additionalProperties: false
      required:
      - name
      - pincodes
      - segments
    Financier:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        valuesVisibleTo:
          type: string
          enum:
          - ECOFY_ADMIN
          - ITARANG_ADMIN
        active: *id013
      additionalProperties: false
      required:
      - name
      - valuesVisibleTo
    ImportStart:
      type: object
      properties:
        fileName:
          type: string
          pattern: \.(xlsx|csv)$
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
      additionalProperties: false
      required:
      - fileName
      - sizeBytes
    UploadTicket:
      type: object
      properties:
        id: *id004
        uploadUrl:
          type: string
          format: uri
        expiresAt: *id014
      additionalProperties: false
      required:
      - id
      - uploadUrl
      - expiresAt
    ImportMapping:
      type: object
      properties:
        mapping:
          type: object
          additionalProperties: *id006
          description: source header -> template column
        saveAs:
          type: string
          maxLength: 60
      additionalProperties: false
      required:
      - mapping
    ImportPreview:
      type: object
      properties:
        rowCount:
          type: integer
        created:
          type: integer
        duplicate:
          type: integer
        reopened:
          type: integer
        newLinked:
          type: integer
        rejected:
          type: integer
        sampleErrors:
          type: array
          items:
            type: object
            properties:
              rowNo:
                type: integer
              column: *id006
              code: *id006
              message: *id006
            additionalProperties: false
            required:
            - rowNo
            - code
      additionalProperties: false
      required:
      - rowCount
      - created
      - duplicate
      - reopened
      - newLinked
      - rejected
    ImportCommit:
      type: object
      properties:
        consentAttested:
          const: true
        attestationText: *id006
      additionalProperties: false
      required:
      - consentAttested
      - attestationText
    Import:
      type: object
      properties:
        id: *id004
        status:
          type: string
          enum:
          - UPLOADED
          - MAPPED
          - VALIDATED
          - COMMITTING
          - COMMITTED
          - FAILED
        preview:
          $ref: '#/components/schemas/ImportPreview'
      additionalProperties: false
      required:
      - id
      - status
    CustomerIn:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        mobile:
          type: string
          pattern: ^[6-9][0-9]{9}$
        altMobile:
          type: string
          pattern: ^[6-9][0-9]{9}$
        email:
          type: string
          format: email
        customerType:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
        businessName: *id006
        address:
          type: string
          minLength: 3
          maxLength: 250
        city: *id006
        state: *id006
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        preferredLanguage: *id006
        propertyType: *id006
        consentObtained:
          const: true
        consentDate: *id015
        consentSource: *id006
      additionalProperties: false
      required:
      - fullName
      - mobile
      - customerType
      - address
      - city
      - state
